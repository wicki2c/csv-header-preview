[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passive-experiment-csv-header-preview"
version = "0.1.0"
description = "Preview ASCII header renames and collisions before using CSV Cleanup. Offline Python, original names visible; no file writes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["csv", "data-cleaning", "cli"]

[project.urls]
"CSV Cleanup Kit" = "https://passiveexperiment.gumroad.com/l/osmloi?utm_source=pypi&utm_medium=sample&utm_campaign=mkt10-csv-cleanup-kit"

[project.scripts]
csv-header-preview = "csv_header_preview:main"

[tool.setuptools]
py-modules = ["csv_header_preview"]
